version: "3.9"

services:
  # ── LangGraph agent backend (port 2024) ────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agent-backend
    restart: unless-stopped
    ports:
      - "2024:2024"
    env_file:
      - .env
    environment:
      - LANGGRAPH_HOST=0.0.0.0
      - LANGGRAPH_PORT=2024
      - NINE_ROUTER_URL=http://ninerouter:20128/v1

    volumes:
      - shared-node-modules:/app/deep-agents-ui-main/node_modules
      - shared-npm-cache:/app/shared_npm_cache

  # ── Feeder HTTP server (port 8080, HTTP-only, no scheduler) ────────────
  feeder_svc:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agent-feeder
    restart: unless-stopped
    command: python feeder_server.py
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - NINE_ROUTER_URL=http://ninerouter:20128/v1
    depends_on:
      - backend

  # ── Cron scheduler (no exposed ports — internal only) ──────────────────
  cron:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agent-cron
    restart: unless-stopped
    command: python cron_scheduler.py
    env_file:
      - .env
    environment:
      - FEEDER_SERVER_URL=http://feeder_svc:8080
      - LANGGRAPH_URL=http://backend:2024
      - NEXT_PUBLIC_APP_URL=http://frontend:3000
      - NINE_ROUTER_URL=http://ninerouter:20128/v1
    depends_on:
      - backend
      - feeder_svc

  # ── Telegram Bot (long polling — internal only) ──────────────────────────
  telegram:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agent-telegram
    restart: unless-stopped
    command: python telegram_server.py
    env_file:
      - .env
    environment:
      - LANGGRAPH_API_URL=http://backend:2024
      - NINE_ROUTER_URL=http://ninerouter:20128/v1
    depends_on:
      - backend

  # ── Next.js frontend (port 3000, public) ───────────────────────────────
  frontend:
    build:
      context: ./deep-agents-ui-main
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_SUPABASE_URL
        - NEXT_PUBLIC_SUPABASE_ANON_KEY
        - NEXT_PUBLIC_NINE_ROUTER_URL
    container_name: agent-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - ./deep-agents-ui-main/.env
    environment:
      - FEEDER_SERVER_URL=http://feeder_svc:8080
      - NEXT_PUBLIC_API_URL=http://backend:2024
      - NINE_ROUTER_INTERNAL_URL=http://ninerouter:20128
    volumes:
      - shared-node-modules:/app/node_modules
      - shared-npm-cache:/app/shared_npm_cache
    depends_on:
      - backend
      - feeder_svc

  # ── 9Router AI Gateway (port 20128, public) ─────────────────────────────
  ninerouter:
    build:
      context: ./9router-master
      dockerfile: Dockerfile
    container_name: ninerouter
    restart: unless-stopped
    ports:
      - "20128:20128"
    volumes:
      - ninerouter-data:/app/data
    env_file:
      - .env
    environment:
      DATA_DIR: /app/data
      PORT: "20128"
      HOSTNAME: "0.0.0.0"
      NODE_ENV: production
      HEADROOM_URL: http://headroom:8787
    depends_on:
      - headroom

  # ── Headroom Token Saver (port 8787, internal) ──────────────────────────
  headroom:
    image: ghcr.io/chopratejas/headroom:latest
    container_name: headroom
    restart: unless-stopped
    ports:
      - "8787:8787"

volumes:
  shared-node-modules:
  shared-npm-cache:
  ninerouter-data:
    name: ninerouter-data

version: "3.9"

services:
  # ── LangGraph agent backend (port 2024) ────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agent-backend
    restart: unless-stopped
    ports:
      - "2024:2024"
    env_file:
      - .env
    environment:
      - LANGGRAPH_HOST=0.0.0.0
      - LANGGRAPH_PORT=2024
      # Override for Docker: Neo4j runs as the "neo4j" service, not localhost
      - NEO4J_URI=bolt://neo4j:7687
      - GRAPH_MEMORY_ENABLED=true
    depends_on:
      neo4j:
        condition: service_healthy

  # ── Feeder HTTP server (port 8080, HTTP-only, no scheduler) ────────────
  feeder_svc:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agent-feeder
    restart: unless-stopped
    command: python feeder_server.py
    ports:
      - "8080:8080"
    env_file:
      - .env
    depends_on:
      - backend

  # ── Cron scheduler (no exposed ports — internal only) ──────────────────
  cron:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agent-cron
    restart: unless-stopped
    command: python cron_scheduler.py
    env_file:
      - .env
    environment:
      - FEEDER_SERVER_URL=http://feeder_svc:8080
      - LANGGRAPH_URL=http://backend:2024
      - NEXT_PUBLIC_APP_URL=http://frontend:3000
      # Override for Docker: Neo4j runs as the "neo4j" service, not localhost
      - NEO4J_URI=bolt://neo4j:7687
      - GRAPH_MEMORY_ENABLED=true
    depends_on:
      - backend
      - feeder_svc

  # ── Telegram Bot (long polling — internal only) ──────────────────────────
  telegram:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agent-telegram
    restart: unless-stopped
    command: python telegram_server.py
    env_file:
      - .env
    environment:
      - LANGGRAPH_API_URL=http://backend:2024
      # Override for Docker: Neo4j runs as the "neo4j" service, not localhost
      - NEO4J_URI=bolt://neo4j:7687
      - GRAPH_MEMORY_ENABLED=true
    depends_on:
      - backend

  # ── Next.js frontend (port 3000, public) ───────────────────────────────
  frontend:
    build:
      context: ./deep-agents-ui-main
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_SUPABASE_URL
        - NEXT_PUBLIC_SUPABASE_ANON_KEY
    container_name: agent-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - ./deep-agents-ui-main/.env
    environment:
      - FEEDER_SERVER_URL=http://feeder_svc:8080
      - NEXT_PUBLIC_API_URL=http://backend:2024
    depends_on:
      - backend
      - feeder_svc

  # ── Neo4j Graph Database (port 7474 for Web UI, 7687 for Bolt connection) ──────
  neo4j:
    image: neo4j:5.12.0
    container_name: agent-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/password
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:7474"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  neo4j_data:
  neo4j_logs:


version: "3.9"

services:
  # ── LangGraph agent backend (port 2024) ────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agent-backend
    restart: unless-stopped
    ports:
      - "2024:2024"
    env_file:
      - .env
    environment:
      - LANGGRAPH_HOST=0.0.0.0
      - LANGGRAPH_PORT=2024
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis
    volumes:
      - shared-node-modules:/app/deep-agents-ui-main/node_modules
      - shared-npm-cache:/app/shared_npm_cache
      - ./data:/app/data
      # Mount output/ and logs/ so files the agent creates via the terminal tool
      # (PDFs, images, scripts) and server logs are visible on the HOST filesystem
      # instead of being trapped inside the container ("sandbox").
      - ./output:/app/output
      - ./logs:/app/logs

  # ── Feeder HTTP server (port 8080, HTTP-only, no scheduler) ────────────
  feeder_svc:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agent-feeder
    restart: unless-stopped
    command: python feeder_server.py
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379
    depends_on:
      - backend
      - redis

  # ── Cron scheduler (no exposed ports — internal only) ──────────────────
  cron:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agent-cron
    restart: unless-stopped
    command: python cron_scheduler.py
    env_file:
      - .env
    environment:
      - FEEDER_SERVER_URL=http://feeder_svc:8080
      - LANGGRAPH_URL=http://backend:2024
      - NEXT_PUBLIC_APP_URL=http://frontend:3000
      - REDIS_URL=redis://redis:6379
    depends_on:
      - backend
      - feeder_svc
      - redis

  # ── Telegram Bot (long polling — internal only) ──────────────────────────
  telegram:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agent-telegram
    restart: unless-stopped
    command: python telegram_server.py
    env_file:
      - .env
    environment:
      - LANGGRAPH_API_URL=http://backend:2024
      - REDIS_URL=redis://redis:6379
    depends_on:
      - backend
      - redis

  # ── Slack Bot (Socket Mode — internal only) ──────────────────────────────
  slack:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agent-slack
    restart: unless-stopped
    command: python slack_server.py
    env_file:
      - .env
    environment:
      - LANGGRAPH_API_URL=http://backend:2024
      - REDIS_URL=redis://redis:6379
    depends_on:
      - backend
      - redis


  # ── Next.js frontend (port 3000, public) ───────────────────────────────
  frontend:
    build:
      context: ./deep-agents-ui-main
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_SUPABASE_URL
        - NEXT_PUBLIC_SUPABASE_ANON_KEY
    container_name: agent-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - ./deep-agents-ui-main/.env
    environment:
      - FEEDER_SERVER_URL=http://feeder_svc:8080
      - NEXT_PUBLIC_API_URL=http://backend:2024
      - REDIS_URL=redis://redis:6379
    volumes:
      - shared-node-modules:/app/node_modules
      - shared-npm-cache:/app/shared_npm_cache
    depends_on:
      - backend
      - feeder_svc
      - redis

  # ── Redis Cache Server (port 6379, internal/public) ──────────────────────
  redis:
    image: redis:7-alpine
    container_name: agent-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  shared-node-modules:
  shared-npm-cache:
